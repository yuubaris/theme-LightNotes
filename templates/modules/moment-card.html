<article class="moment-card glass-card" th:fragment="card(moment)">
  <div class="moment-header">
    <a class="moment-author" th:href="@{|/authors/${moment.owner?.name}|}">
      <span
        class="avatar avatar-md"
        th:classappend="${#strings.isEmpty(moment.owner?.avatar)} ? 'avatar-text' : ''"
      >
        <img
          th:if="${not #strings.isEmpty(moment.owner?.avatar)}"
          th:src="${moment.owner.avatar}"
          th:alt="${moment.owner.displayName}"
          loading="lazy"
        />
        <span
          th:if="${#strings.isEmpty(moment.owner?.avatar)}"
          th:text="${#strings.substring(moment.owner?.displayName ?: '小', 0, 1)}"
          >友</span
        >
      </span>
      <span class="moment-author-info">
        <span class="moment-nickname" th:text="${moment.owner?.displayName ?: moment.owner?.name}"
          >昵称</span
        >
        <span class="moment-time">
          <time
            th:datetime="${moment.spec.releaseTime ?: moment.metadata.creationTimestamp}"
            th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'yyyy-MM-dd HH:mm')}"
            >2026-01-01 12:00</time
          >
        </span>
      </span>
    </a>
    <details class="more-menu">
      <summary aria-label="更多操作" title="更多操作">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="19" cy="12" r="1.8" />
        </svg>
      </summary>
      <div class="more-menu-panel glass-card">
        <a th:href="@{|/moments/${moment.metadata.name}|}" th:text="#{moments.detail}">查看详情</a>
        <button
          type="button"
          class="ln-share"
          th:attr="data-share-url=@{|/moments/${moment.metadata.name}|}"
          th:text="#{card.copylink}"
        >
          复制链接
        </button>
      </div>
    </details>
  </div>

  <div class="moment-tags" th:if="${not #lists.isEmpty(moment.spec.tags)}">
    <span class="meta-pill meta-tag" th:each="tag : ${moment.spec.tags}" th:text="|# ${tag}|"
      ># 标签</span
    >
  </div>

  <div
    class="moment-content"
    th:if="${not #strings.isEmpty(moment.spec.content?.html)}"
    th:utext="${moment.spec.content.html}"
  >
    说说正文
  </div>

  <div class="moment-medium" th:if="${not #lists.isEmpty(moment.spec.content?.medium)}">
    <th:block th:each="media : ${moment.spec.content.medium}">
      <a
        class="medium-item"
        th:if="${media.type?.name == 'PHOTO'}"
        th:href="@{|/moments/${moment.metadata.name}|}"
        th:aria-label="查看图片"
      >
        <img th:src="${media.url}" loading="lazy" alt="瞬间图片" />
      </a>
      <video
        class="medium-video"
        th:if="${media.type?.name == 'VIDEO'}"
        th:src="${media.url}"
        controls
        preload="metadata"
      ></video>
      <audio
        class="medium-audio"
        th:if="${media.type?.name == 'AUDIO'}"
        th:src="${media.url}"
        controls
        preload="none"
      ></audio>
    </th:block>
  </div>

  <div class="moment-actions">
    <button
      type="button"
      class="action-btn ln-like"
      th:attr="data-group='moment.halo.run', data-plural='moments', data-name=${moment.metadata.name}"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
      <span class="ln-like-count" th:text="${moment.stats?.upvote ?: 0}">0</span>
    </button>
    <a class="action-btn" th:href="@{|/moments/${moment.metadata.name}|}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
      <span th:text="${moment.stats?.approvedComment ?: 0}">0</span>
    </a>
    <button
      type="button"
      class="action-btn ln-share"
      th:attr="data-share-url=@{|/moments/${moment.metadata.name}|}"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
      </svg>
      <span th:text="#{card.share}">分享</span>
    </button>
  </div>
</article>
