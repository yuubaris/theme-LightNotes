<nav
  class="pagination glass-card"
  th:fragment="pagination(pageResult)"
  th:if="${pageResult.hasPrevious() || pageResult.hasNext()}"
  aria-label="分页"
>
  <a
    th:if="${pageResult.hasPrevious()}"
    class="page-btn"
    th:href="@{${pageResult.prevUrl}}"
    th:text="#{pagination.previous}"
    >上一页</a
  >
  <span
    class="page-info"
    th:text="#{pagination.page(${pageResult.page}, ${pageResult.totalPages})}"
    >第 1 / 1 页</span
  >
  <a
    th:if="${pageResult.hasNext()}"
    class="page-btn page-btn-next"
    th:href="@{${pageResult.nextUrl}}"
    th:text="#{pagination.next}"
    >下一页</a
  >
</nav>
